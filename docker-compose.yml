services:
  postgres:
    image: postgres:16
    container_name: registry_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: registry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ingestion:
    build:
      context: .
      dockerfile: src/ingestion/Dockerfile
    env_file: .env
    volumes:
      - ./data/raw:/app/data/raw:ro

  cleaning:
    build:
      context: .
      dockerfile: src/cleaning/Dockerfile
    env_file: .env
    depends_on:
      - ingestion

  matching:
    build:
      context: .
      dockerfile: src/matching/Dockerfile
    env_file: .env
    depends_on:
      - cleaning

  graph:
    build:
      context: .
      dockerfile: src/graph/Dockerfile
    env_file: .env
    depends_on:
      - matching

  scoring:
    build:
      context: .
      dockerfile: src/scoring/Dockerfile
    env_file: .env
    depends_on:
      - graph

  integrity:
    build:
      context: .
      dockerfile: src/integrity/Dockerfile
    env_file: .env
    depends_on:
      - scoring

volumes:
  pgdata: