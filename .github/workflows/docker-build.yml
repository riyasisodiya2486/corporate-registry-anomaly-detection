name: Build Docker Images

'on':
  push:
    branches:
      - main
      - yashika-infra
      - yashika-v2
  pull_request:
    branches:
      - main
      - yashika-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all service images
        run: docker compose build